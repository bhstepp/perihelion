# Compiles the iOS app for the simulator on every change that can affect it, so a broken Swift file or Xcode project
# shows up as a red check here instead of as a surprise in Xcode. Nothing is signed or uploaded.
name: iOS build

on:
  push:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'tools/build.js'
      - 'tools/build-ios.js'
      - 'tools/ios-test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the game page and sync it into the Xcode project
        run: npm run ios:sync

      - name: Check the page and its native layer
        run: |
          npx playwright install chromium
          npm run test:ios

      - name: Compile for the iOS Simulator
        run: |
          xcodebuild -version
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
