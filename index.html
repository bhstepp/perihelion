<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* owner: INPUT & FEEL AGENT (DOM/CSS). Tokens are frozen by the contract (§8). */
:root {
  padding: 0 !important;           /* neutralise the artifact host's safe-area padding on :root */
  --ink: #0E0D0B; --paper: #EDE6D6; --graphite: #2A2620; --vermilion: #E4572E; --brass: #C9A45C;
  --paper-90: rgba(237,230,214,.9); --paper-75: rgba(237,230,214,.75); --paper-60: rgba(237,230,214,.6);
  --paper-45: rgba(237,230,214,.45); --hair: rgba(237,230,214,.42); --hair-faint: rgba(237,230,214,.17);
  --press: rgba(237,230,214,.08); --brass-hair: rgba(201,164,92,.72); --brass-faint: rgba(201,164,92,.3);
  --ink-veil: rgba(14,13,11,.86); --ink-card: rgba(14,13,11,.95);
  --sc: "Cormorant SC", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.22,.8,.26,1); --ease-back: cubic-bezier(.3,1.35,.5,1); --t: 280ms;
  --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0 !important; padding: 0 !important; background: var(--ink); color: var(--paper);
  overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; font-family: var(--serif); -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased; }
html, body, #ui, #ui * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
*, *::before, *::after { box-sizing: border-box; }
#game { position: fixed; inset: 0; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--ink); }
#safe-probe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
button { font: inherit; color: inherit; }
/* small caps also when Cormorant SC fails to load (fallback serif synthesises them) */
.btn, .txtbtn, .kicker, .t-ed, .tally, .c-stats, .s-title, .c-title, .pl-num, .sealed span { font-variant-caps: small-caps; }

/* ---------- shared atlas typography ---------- */
.rule { width: min(78vw, 420px); height: 4px; margin: 0 auto; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.rule.narrow { width: min(46vw, 220px); border-color: var(--hair-faint); }
.note { font-family: var(--serif); font-style: italic; font-weight: 500; color: var(--paper-75); margin: 0; }
.kicker { font-family: var(--sc); font-weight: 600; font-size: 13px; letter-spacing: .2em; color: var(--paper-60); margin: 0; }
.mono, .tally b, .c-stats b { font-family: var(--mono); font-weight: 400; letter-spacing: 0; font-variant-numeric: tabular-nums; }

.btn { -webkit-appearance: none; appearance: none; background: transparent; border: 1px solid var(--hair); border-radius: 0;
  color: var(--paper); font-family: var(--sc); font-weight: 600; font-size: 17px; letter-spacing: .14em; line-height: 1;
  min-height: 48px; padding: 0 20px 2px; cursor: pointer; touch-action: manipulation; pointer-events: auto;
  transition: background-color 200ms var(--ease), border-color 200ms var(--ease), color 200ms var(--ease), transform 200ms var(--ease); }
.btn:active, .btn.pressed { background: var(--press); transform: translateY(1px); }
.btn.primary { color: var(--brass); border-color: var(--brass-hair); outline: 1px solid var(--brass-faint); outline-offset: 3px; }
.btn:focus { outline: none; }
.btn.primary:focus { outline: 1px solid var(--brass-faint); }
.btn:focus-visible, .txtbtn:focus-visible, .plate:focus-visible { outline: 1px solid var(--brass); outline-offset: 3px; }
.txtbtn { -webkit-appearance: none; appearance: none; background: none; border: 0; border-radius: 0; color: var(--paper-60);
  font-family: var(--sc); font-weight: 600; font-size: 14px; letter-spacing: .18em; min-height: 44px; min-width: 44px;
  padding: 0 12px 2px; cursor: pointer; touch-action: manipulation; pointer-events: auto; transition: color 200ms var(--ease); }
.txtbtn:active { color: var(--paper); }
.txtbtn:focus:not(:focus-visible) { outline: none; }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; opacity: 0; visibility: hidden; transform: translateY(8px); pointer-events: none;
  transition: opacity var(--t) var(--ease), transform var(--t) var(--ease), visibility 0s linear var(--t); }
.screen.on { opacity: 1; visibility: visible; transform: none; pointer-events: auto;
  transition: opacity var(--t) var(--ease), transform var(--t) var(--ease), visibility 0s linear 0s; }

/* title */
#scr-title { display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center;
  padding: calc(var(--sat) + 8vh) calc(var(--sar) + 24px) calc(var(--sab) + 5vh) calc(var(--sal) + 24px); }
.t-head { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.t-name { font-family: var(--sc); font-weight: 600; font-size: clamp(30px, 9.4vw, 72px); letter-spacing: .22em;
  line-height: 1; margin: 2px 0 0; padding-left: .22em; color: var(--paper); text-transform: uppercase; }
.t-sub { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: clamp(17px, 4.7vw, 24px);
  color: var(--paper-90); margin: 4px 0 0; line-height: 1.2; max-width: 22em; }
.t-ed { font-family: var(--sc); font-weight: 600; font-size: 13px; letter-spacing: .2em; color: var(--paper-60); margin: 0; }
.t-menu { display: flex; flex-direction: column; align-items: stretch; gap: 14px; width: min(78vw, 320px); }
.t-best { font-size: 16px; min-height: 1.2em; text-align: center; margin-top: 2px; }
.t-best b { font-family: var(--mono); font-style: normal; font-weight: 400; font-size: 13px; color: var(--paper); }
.t-menu .txtbtn { align-self: center; margin-top: -6px; }

/* select */
#scr-select { background: var(--ink); display: flex; flex-direction: column; }
.s-head { flex: none; position: relative; text-align: center; padding: calc(var(--sat) + 14px) calc(var(--sar) + 16px) 12px calc(var(--sal) + 16px);
  border-bottom: 3px double var(--hair-faint); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.s-back { position: absolute; left: calc(var(--sal) + 4px); top: calc(var(--sat) + 6px); }
.s-title { font-family: var(--sc); font-weight: 600; font-size: 28px; letter-spacing: .2em; padding-left: .2em; margin: 4px 0 0; line-height: 1.1; }
.tally { font-family: var(--sc); font-weight: 600; font-size: 13px; letter-spacing: .16em; color: var(--paper-60); margin: 0; }
.tally b { font-size: 12px; color: var(--paper); }
.tally .sep { padding: 0 .5em; color: var(--paper-45); }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain;
  padding: 16px calc(var(--sar) + 16px) calc(var(--sab) + 28px) calc(var(--sal) + 16px); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; max-width: 560px; margin: 0 auto; }
.plate { -webkit-appearance: none; appearance: none; background: transparent; border: 1px solid var(--hair-faint); border-radius: 0;
  padding: 5px 5px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; min-height: 44px;
  color: var(--paper); text-align: center; cursor: pointer; touch-action: manipulation;
  transition: border-color 200ms var(--ease), background-color 200ms var(--ease), transform 200ms var(--ease); }
.plate:active { background: var(--press); transform: translateY(1px); }
.plate.done { border-color: rgba(201,164,92,.34); }
.thumb-wrap { position: relative; width: 100%; aspect-ratio: 9 / 16; border: 1px solid var(--hair-faint); overflow: hidden; }
.thumb { display: block; width: 100%; height: 100%; }
.pl-num { font-family: var(--sc); font-weight: 600; font-size: 17px; letter-spacing: .12em; line-height: 1; margin-top: 5px; }
.pl-name { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 13px; line-height: 1.1; color: var(--paper-75);
  max-width: 100%; height: 2.2em; overflow: hidden; white-space: normal; display: flex; align-items: center; justify-content: center; }
.pl-meta { display: flex; align-items: center; gap: 3px; height: 13px; }
.plate.locked { cursor: default; }
.plate.locked .thumb { opacity: .2; }
.plate.locked .pl-num, .plate.locked .pl-name, .plate.locked .pl-meta { opacity: .4; }
.sealed[hidden] { display: none; }
.sealed { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.sealed span { font-family: var(--sc); font-weight: 600; font-size: 12px; letter-spacing: .24em; padding: 5px 4px 6px 8px; color: var(--paper-75);
  border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.colophon { text-align: center; font-size: 15px; margin: 22px auto 0; max-width: 20em; color: var(--paper-60); }

/* stars & comet glyphs (inline svg) */
svg.star path { fill: none; stroke: var(--paper-45); stroke-width: 1.2; stroke-linejoin: round; }
svg.star.on path { fill: var(--brass); stroke: var(--brass); }
svg.comet { margin-left: 4px; }
svg.comet * { stroke: var(--brass); stroke-width: 1; fill: none; stroke-linecap: round; }
svg.comet circle { fill: var(--brass); stroke: none; }
svg.comet.off * { stroke: var(--paper-45); }
svg.comet.off circle { fill: var(--paper-45); }
.pl-meta .fr { font-family: var(--mono); font-size: 10px; color: var(--paper-60); margin-left: 2px; }

/* ---------- play layer ---------- */
.layer { position: absolute; inset: 0; pointer-events: none; opacity: 0; visibility: hidden;
  transition: opacity var(--t) var(--ease), visibility 0s linear var(--t); }
.layer.on { opacity: 1; visibility: visible; transition: opacity var(--t) var(--ease), visibility 0s linear 0s; }
.hud-zone { position: absolute; display: flex; align-items: center; justify-content: flex-start; padding: 0 0 0 12px; pointer-events: none; }
.hud-zone.right { justify-content: flex-end; padding: 0 12px 0 0; }
.btn.hud-btn { font-size: 14px; letter-spacing: .18em; min-height: 44px; min-width: 64px; padding: 0 12px 2px; border-color: var(--hair-faint); color: var(--paper-75); }
.margin-note { position: absolute; margin: 0; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 17px; line-height: 1.25;
  color: var(--paper-75); pointer-events: none; opacity: 0; transform: translateY(4px);
  transition: opacity 600ms var(--ease), transform 600ms var(--ease); }
.margin-note.on { opacity: 1; transform: none; }
#hint { text-align: right; }
#hint.left { text-align: left; }
#hint::before { content: ""; display: block; width: 36px; height: 0; margin: 0 0 8px auto; border-top: 1px solid var(--hair); }
#hint.left::before { margin: 0 auto 8px 0; }
#note { text-align: center; font-size: 16px; color: var(--paper-60); }

/* result card */
.card { position: absolute; left: 0; top: 0; width: 340px; padding: 14px 16px 12px; overflow-y: auto; overscroll-behavior: contain; text-align: center; background: var(--ink-card);
  border: 1px solid var(--hair); outline: 1px solid var(--hair-faint); outline-offset: -6px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  opacity: 0; visibility: hidden; transform: translateY(14px) scale(.98); pointer-events: none;
  transition: opacity 320ms var(--ease), transform 340ms var(--ease-back), visibility 0s linear 340ms; }
.card.on { opacity: 1; visibility: visible; transform: none; pointer-events: auto;
  transition: opacity 320ms var(--ease), transform 340ms var(--ease-back), visibility 0s linear 0s; }
.c-title { font-family: var(--sc); font-weight: 600; font-size: 27px; letter-spacing: .16em; padding-left: .16em; margin: 0; line-height: 1.1; color: var(--paper); }
.c-title.win { color: var(--brass); }
.card .note, .panel .note { font-size: 17px; }
.card .note { font-size: 16px; line-height: 1.2; }
.card .c-title { font-size: 24px; }
.c-stars { display: flex; gap: 8px; margin: 2px 0 0; }
.c-stats { font-family: var(--sc); font-weight: 600; font-size: 13px; letter-spacing: .16em; color: var(--paper-60); margin: 0; }
.c-stats b { font-size: 12px; color: var(--paper); }
.c-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }
.c-btns .btn { width: 100%; padding: 0 8px 2px; font-size: 16px; }
.c-btns .wide { grid-column: 1 / -1; }
.card .c-btns { margin-top: 6px; }
.c-btns.three { grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; }
.c-btns.three .btn { font-size: 15px; letter-spacing: .1em; padding: 0 4px 2px; }
.card .c-btns .btn { white-space: nowrap; }
.card.narrow .c-btns.three { grid-template-columns: 1fr 1fr 1.45fr; gap: 6px; }
.card.narrow .c-btns.three .btn { font-size: 14px; letter-spacing: .05em; padding: 0 2px 2px; }

/* pause sheet */
.overlay { position: absolute; inset: 0; background: var(--ink-veil); display: flex; align-items: center; justify-content: center;
  padding: calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity var(--t) var(--ease), visibility 0s linear var(--t); }
.overlay.on { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity var(--t) var(--ease), visibility 0s linear 0s; }
.panel { width: min(340px, 100%); padding: 24px 20px 14px; text-align: center; background: var(--ink);
  border: 1px solid var(--hair); outline: 1px solid var(--hair-faint); outline-offset: -6px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  transform: translateY(10px); transition: transform var(--t) var(--ease); }
.overlay.on .panel { transform: none; }
.panel .c-btns { grid-template-columns: 1fr; }

/* short landscape screens */
@media (orientation: landscape) and (max-height: 520px) {
  .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); max-width: 820px; }
}
@media (max-height: 520px) {
  #scr-title { padding-top: calc(var(--sat) + 18px); padding-bottom: calc(var(--sab) + 12px); }
  .t-head { gap: 8px; }
  .t-menu { gap: 8px; }
  .t-name { font-size: clamp(28px, 7vh, 48px); }
}
@media (prefers-reduced-motion: reduce) {
  .screen, .screen.on, .layer, .layer.on, .card, .card.on, .overlay, .overlay.on, .panel, .margin-note, .btn, .plate {
    transition-duration: 1ms !important; transition-delay: 0s !important; }
  .screen, .card, .panel, .margin-note { transform: none !important; }
}
</style>

<body>
<canvas id="game" aria-label="Perihelion playfield"></canvas>
<div id="safe-probe" aria-hidden="true"></div>
<div id="ui">

  <section id="scr-title" class="screen on" aria-label="Title">
    <header class="t-head">
      <div class="rule"></div>
      <h1 class="t-name">Perihelion</h1>
      <div class="rule"></div>
      <p class="t-sub">A Celestial Atlas of Slingshot Trajectories</p>
      <p class="t-ed">Plates I&ndash;XXX &middot; Engraved MMXXVI</p>
    </header>
    <nav class="t-menu">
      <button class="btn primary" data-act="begin">Begin the Atlas</button>
      <button class="btn" data-act="endless">Endless Survey</button>
      <p class="t-best note" id="t-best"></p>
      <button class="txtbtn" data-act="sound" data-sound>Sound: On</button>
    </nav>
  </section>

  <section id="scr-select" class="screen" aria-label="The Atlas">
    <header class="s-head">
      <button class="txtbtn s-back" data-act="title">&lsaquo; Title</button>
      <h2 class="s-title">The Atlas</h2>
      <div class="rule narrow"></div>
      <p class="tally" id="tally"></p>
    </header>
    <div class="scroll" id="s-scroll">
      <div class="grid" id="grid"></div>
      <p class="colophon note">Each plate admits three launches. Seal it in one for three stars.</p>
    </div>
  </section>

  <div id="play-ui" class="layer" aria-label="Plate controls">
    <div class="hud-zone" id="zone-l"><button class="btn hud-btn" data-act="reset">Reset</button></div>
    <div class="hud-zone right" id="zone-r"><button class="btn hud-btn" data-act="menu">Menu</button></div>
    <p class="margin-note" id="hint">Pull back anywhere<br>and release to launch.</p>
    <p class="margin-note" id="note"></p>
    <div class="card" id="card" role="dialog" aria-live="polite"></div>
  </div>

  <div id="sheet" class="overlay" role="dialog" aria-label="Paused">
    <div class="panel" id="sheet-panel">
      <p class="kicker" id="sheet-kicker">Plate I</p>
      <h3 class="c-title">Paused</h3>
      <p class="note">Tap anywhere to resume.</p>
      <div class="c-btns">
        <button class="btn primary" data-act="resume">Resume</button>
        <button class="btn" data-act="restart">Restart plate</button>
        <button class="btn" data-act="atlas" id="sheet-exit">Return to the Atlas</button>
      </div>
      <button class="txtbtn" data-act="sound" data-sound>Sound: On</button>
    </div>
  </div>

</div>

<script>
"use strict";
// ===================== MODULE: 00-const.js =====================
/* PERIHELION — shared constants & palette (owner: LEAD). FROZEN: do not change numeric values
   without the lead's approval; the baked campaign levels and their verified solutions depend on them. */
var K = {
  WORLD_W: 900,          // logical world units (portrait plate)
  WORLD_H: 1600,
  BOUNDS_MARGIN: 220,    // probe is "lost" once it is this far outside the world rect
  DT: 1 / 120,           // fixed physics step (120 Hz)
  MAX_STEPS: 1200,       // 10 s of simulated flight
  PREDICT_STEPS: 420,    // 35% of flight shown while aiming
  EPS2: 400,             // gravity softening, eps = 20 units
  PROBE_R: 6,            // probe collision radius
  FRAG_R: 24,            // comet fragment pickup radius
  DRAG_MAX: 300,         // world units of pull for full power (~120 CSS px on an iPhone)
  DRAG_CANCEL: 40,       // release with a pull shorter than this = cancel
  VMAX: 640,             // launch speed at full power (units/s)
  MAX_LAUNCHES: 3,
  TRAIL_MAX: 720,        // pooled trail ring size (points)
  MAX_STEPS_PER_FRAME: 16
};

var PAL = {
  ink: '#0E0D0B',        // background
  paper: '#EDE6D6',      // all line work
  graphite: '#2A2620',   // grid, faint marks
  vermilion: '#E4572E',  // probe, trajectory, danger
  brass: '#C9A45C',      // target, stars, success
  // same hues at an alpha — the ONLY way to vary tone. No other hues.
  a: function (name, alpha) {
    var h = PAL[name].slice(1);
    var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }
};

var FONT = {
  sc: '"Cormorant SC", "Cormorant Garamond", Georgia, "Times New Roman", serif',   // small-caps titles
  serif: '"Cormorant Garamond", Georgia, "Times New Roman", serif',                // italic notes
  mono: '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace'              // numbers
};

function toRoman(n) {
  var m = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  var s = '';
  for (var i = 0; i < m.length; i++) while (n >= m[i][0]) { s += m[i][1]; n -= m[i][0]; }
  return s;
}

// ===================== MODULE: 10-physics.js =====================
/* PERIHELION — physics (owner: PHYSICS AGENT; reference core written by LEAD).
   Integrator: semi-implicit (symplectic) Euler at a fixed DT = K.DT (120 Hz):
     a = accel(bodies at t = abs*DT);  v += a*DT;  x += v*DT;  abs++;
   then, against body positions at the END of the step (t = abs*DT), in this order: fragment pickups ->
   body collisions (per body: blackhole capture, then crash) -> target -> bounds -> timeout (K.MAX_STEPS).
   Gravity is softened Newtonian: a = mu*d / (|d|^2 + EPS2)^1.5 (mu < 0 = repulsor).
   DETERMINISM RULE: numeric behaviour is FROZEN (baked levels + solutions depend on it; see
   tools/physics-golden.json). Time is ALWAYS abs*DT from an integer step counter, never accumulated.
   predict/simulate and the live flight run the very same createSim + stepSim, so a predicted point is
   bit-identical (===) to the live probe at that step. Never reorder float ops here; `node tools/physics-test.js`
   must stay green. Guards for bad input (NaN/Infinity) only change results for non-finite values. */
var Physics = (function () {
  var C = K, DT = K.DT, sqrt = Math.sqrt, cos = Math.cos, sin = Math.sin; // locals: fast in vm and browser

  // Body position at absolute time t (seconds). Bodies with `orbit` move on rails: angle = phase + omega*t.
  function bodyPos(b, t, out) {
    var o = b.orbit;
    if (o) {
      var a = o.phase + o.omega * t;
      out.x = o.cx + o.rad * cos(a);
      out.y = o.cy + o.rad * sin(a);
    } else {
      out.x = b.x; out.y = b.y;

// ===================== MODULE: 50-save.js =====================
/* PERIHELION — save (owner: INPUT & FEEL AGENT).
   localStorage key 'perihelion.v1'. Every storage access is wrapped in try/catch; if storage is unavailable
   (private mode, sandboxed iframe, quota) the game keeps working from the in-memory copy. */
var Save = (function () {
  var KEY = 'perihelion.v1', N = 30;
  var persistent = false;

  function zeros(n) { var a = []; for (var i = 0; i < n; i++) a.push(0); return a; }
  function fresh() { return { v: 1, stars: zeros(N), frags: zeros(N), unlocked: 1, endlessBest: 0, muted: false }; }
  function int(x, lo, hi) {
    x = Number(x);
    if (!isFinite(x)) return lo;
    x = Math.floor(x);
    return x < lo ? lo : x > hi ? hi : x;
  }
  // Defensive merge of whatever JSON we find: unknown/garbage fields are dropped, ranges clamped.
  function merge(raw) {
    var d = fresh();
    if (!raw || typeof raw !== 'object') return d;
    var i;
    if (Array.isArray(raw.stars)) for (i = 0; i < N; i++) d.stars[i] = int(raw.stars[i], 0, 3);
    if (Array.isArray(raw.frags)) for (i = 0; i < N; i++) d.frags[i] = int(raw.frags[i], 0, 9);
    d.unlocked = int(raw.unlocked, 1, N);
    // a plate with stars implies the next is open, even if 'unlocked' was lost
    for (i = 0; i < N; i++) if (d.stars[i] > 0) d.unlocked = Math.max(d.unlocked, Math.min(N, i + 2));
    d.endlessBest = int(raw.endlessBest, 0, 1e6);
    d.muted = raw.muted === true;
    return d;
  }

  var data = fresh();

  function load() {
    var s = null;
    try { s = window.localStorage.getItem(KEY); persistent = true; } catch (e) { persistent = false; }
    if (s) { try { data = merge(JSON.parse(s)); } catch (e) { data = fresh(); } }
    return data;
  }
  function write() {
    try { window.localStorage.setItem(KEY, JSON.stringify(data)); persistent = true; return true; }
    catch (e) { persistent = false; return false; }
  }

  // Record a sealed plate; keeps the best stars / fragments and opens the next plate.
  function recordPlate(i, stars, frags) {
    if (!(i >= 0 && i < N)) return { improved: false };
    var prev = data.stars[i];
    data.stars[i] = Math.max(prev, int(stars, 0, 3));
    data.frags[i] = Math.max(data.frags[i], int(frags, 0, 9));
    data.unlocked = Math.min(N, Math.max(data.unlocked, i + 2));
    write();
    return { improved: data.stars[i] > prev, first: prev === 0 };
  }
  function recordEndless(score) {
    if (score > data.endlessBest) { data.endlessBest = int(score, 0, 1e6); write(); return true; }
    return false;
  }
  function setMuted(b) { data.muted = !!b; write(); }
  function totals() {
    var s = 0, f = 0;
    for (var i = 0; i < N; i++) { s += data.stars[i]; f += data.frags[i]; }
    return { stars: s, frags: f };
  }
  function reset() { data = fresh(); write(); return data; }

  load();

  return {
    KEY: KEY, N: N,
    get data() { return data; },
    get persistent() { return persistent; },
    load: load, write: write, merge: merge,
    recordPlate: recordPlate, recordEndless: recordEndless, setMuted: setMuted, totals: totals, reset: reset
  };
})();

    if (want) hintShown = true;
    elHint.classList.toggle('on', !!want);
  }
  var noteTimer = 0;
  function showNote(text) {
    if (text) { elNote.textContent = text; elNote.classList.add('on'); }
    else elNote.classList.remove('on');
  }

  // ---- result cards
  var cardShownAt = 0;
  function showCard(html) {
    elCard.innerHTML = html;
    placeCard();
    elCard.classList.add('on');
    cardShownAt = nowMs();
    showNote('');
  }
  function hideCard() { elCard.classList.remove('on'); }
  function cardVisible() { return elCard.classList.contains('on'); }
  function kicker() { return state.mode === 'endless' ? 'Endless &middot; Plate ' + toRoman(state.endless.round) : 'Plate ' + toRoman(state.levelIndex + 1); }
  function statsLine() {
    var nf = state.level.frags ? state.level.frags.length : 0;
    var s = 'Launches <b>' + state.launches + '</b>/<b>' + K.MAX_LAUNCHES + '</b>';
    if (nf) s += '<span class="sep"> &middot; </span>Fragments <b>' + countFrags() + '</b>/<b>' + nf + '</b>';
    return s;
  }
  function showSuccessCard() {
    if (state.screen !== 'play' || !state.result || !state.result.success) return;
    var r = state.result, h;
    if (state.mode === 'campaign') {
      var last = state.levelIndex >= CAMP.length - 1;
      var rec = r.record || {};
      var note = last ? 'The atlas is complete.' : (r.stars === 3 ? 'A clean passage, in a single launch.' : (rec.improved && !rec.first ? 'A finer record than before.' : escapeHtml(state.level.name || '')));
      h = '<p class="kicker">' + kicker() + '</p><h3 class="c-title win">Sealed</h3>' +
        '<p class="note">' + note + '</p>' +
        '<div class="c-stars">' + starsRow(r.stars, 20) + '</div>' +
        '<p class="c-stats">' + statsLine() + '</p>' +
        (last ? '<div class="c-btns"><button class="btn" data-act="replay">Replay</button>' +
                '<button class="btn primary" data-act="atlas">Atlas</button></div>'
              : '<div class="c-btns three"><button class="btn" data-act="replay">Replay</button>' +
                '<button class="btn" data-act="atlas">Atlas</button>' +
                '<button class="btn primary" data-act="next">Next plate</button></div>');
    } else {
      h = '<p class="kicker">' + kicker() + '</p><h3 class="c-title win">Surveyed</h3>' +
        '<div class="c-stars">' + starsRow(r.stars, 20) + '</div>' +
        '<p class="c-stats">Score <b>' + state.endless.score + '</b><span class="sep"> &middot; </span>Best <b>' + Math.max(state.endless.best, state.endless.score) + '</b></p>' +
        '<div class="c-btns"><button class="btn" data-act="end">End survey</button>' +
        '<button class="btn primary" data-act="next">Next plate</button></div>';
    }
    showCard(h);
    if (state.mode === 'endless') preGenerate(state.endless.round + 1);
  }
  function showFailCard() {
    if (state.screen !== 'play' || !state.result || state.result.success) return;
    var h, why = FAIL_TEXT[state.result.status] || '';
    if (state.mode === 'campaign') {
      h = '<p class="kicker">' + kicker() + '</p><h3 class="c-title">Unsealed</h3>' +
        '<p class="note">' + why + ' Three launches spent.</p>' +
        '<div class="c-stars">' + starsRow(0, 20) + '</div>' +
        '<div class="c-btns"><button class="btn" data-act="atlas">Atlas</button>' +
        '<button class="btn primary" data-act="retry">Retry plate</button></div>';
    } else {
      var rounds = state.endless.round - 1;
      h = '<p class="kicker">' + kicker() + '</p><h3 class="c-title">Survey Concluded</h3>' +
        '<p class="note">' + why + ' ' + (rounds === 1 ? 'One plate' : (rounds ? toRoman(rounds) + ' plates' : 'No plates')) + ' surveyed.</p>' +
        '<p class="c-stats">Score <b>' + state.endless.score + '</b><span class="sep"> &middot; </span>Best <b>' + Math.max(state.endless.best, state.endless.score) + '</b></p>' +
        '<div class="c-btns"><button class="btn" data-act="title">Title</button>' +
        '<button class="btn primary" data-act="newrun">New survey</button></div>';
    }
    showCard(h);
  }

  // ---- pause sheet
  function showSheet() {
    $('sheet-kicker').innerHTML = kicker();
    $('sheet-exit').textContent = state.mode === 'endless' ? 'End survey' : 'Return to the Atlas';
    refreshSoundButtons();
    elSheet.classList.add('on');
  }
  function hideSheet() { elSheet.classList.remove('on'); }
  function pause() {
    if (state.screen !== 'play' || state.paused) return;
    state.paused = true;
    clearAim();
    Sound.droneStop();
    showSheet();
    snapshot();
  }
  function resume() {
    if (!state.paused) return;
    state.paused = false;
    hideSheet();
    Sound.resume();
    last = 0; acc = 0;
    if (state.phase === 'flight' && state.sim && state.sim.status === 'flying') Sound.droneStart();
  }

  // ------------------------------------------------------------------ actions (buttons)
  function act(name, el) {
    Sound.tick();
    switch (name) {
      case 'begin': setScreen('select'); break;
      case 'endless': startEndless(); break;
      case 'sound': Sound.setMuted(!Sound.isMuted()); if (!Sound.isMuted()) { Sound.unlock(function () { Sound.chime(); }); } refreshSoundButtons(); break;
      case 'title': setScreen('title'); break;
      case 'plate':
        var i = +el.getAttribute('data-i');
        if (i >= Save.data.unlocked) { vibrate(6); return; }
        loadCampaign(i); break;
      case 'reset': if (state.screen === 'play') { if (state.mode === 'endless' && state.phase === 'result' && !state.result.success) startEndless(); else resetAttempt(); } break;
      case 'menu': pause(); break;
      case 'resume': resume(); break;
      case 'restart': resume(); resetAttempt(); break;
      case 'atlas': setScreen(state.mode === 'endless' ? 'title' : 'select'); break;
      case 'next':
        if (state.mode === 'endless') nextEndless();
        else if (state.levelIndex + 1 < CAMP.length) loadCampaign(state.levelIndex + 1);
        else setScreen('select');
        break;
      case 'replay': case 'retry': resetAttempt(); break;
      case 'end': setScreen('title'); break;
      case 'newrun': startEndless(); break;
    }
  }
  ui.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act], .plate') : null;
    if (!t) {
      if (state.paused && elSheet.contains(e.target)) { Sound.tick(); resume(); }
      return;
    }
    if (t.classList.contains('plate')) act('plate', t);
    else act(t.getAttribute('data-act'), t);
  });

  // ------------------------------------------------------------------ input: aiming
  var ptr = { id: null, sx: 0, sy: 0 };
  function canAim() {
    return state.screen === 'play' && !state.paused && state.phase === 'aim' && !cardVisible() &&
      state.launches < K.MAX_LAUNCHES && !!state.level;
  }
  function aimStart(id, x, y) {
    if (ptr.id !== null || !canAim()) return false;
    ptr.id = id; ptr.sx = x; ptr.sy = y;
    var a = state.aim;
    a.active = true; a.dx = 0; a.dy = 0; a.power = 0; a.vx = 0; a.vy = 0; a.cancel = true;
    return true;
  }
  function aimMove(x, y) {
    var a = state.aim;
    if (!a.active) return;
    var sc = (Render.layout && Render.layout.scale) || 1;
    var dx = (x - ptr.sx) / sc, dy = (y - ptr.sy) / sc;
    var lv = Physics.launchVelocity(dx, dy);
    var wasCancel = a.cancel;
    a.dx = dx; a.dy = dy; a.power = lv.power; a.vx = lv.vx; a.vy = lv.vy; a.cancel = lv.cancel;
    if (wasCancel !== lv.cancel) { Sound.tick(); if (!lv.cancel) vibrate(4); }
  }
  function aimEnd(x, y, cancelled) {
    var a = state.aim;
    if (!a.active) { ptr.id = null; return; }
    if (!cancelled && x != null) aimMove(x, y);
    var go = !cancelled && !a.cancel && canAim();
    var vx = a.vx, vy = a.vy, p = a.power;
    clearAim();
    if (go) doLaunch(vx, vy, p);
  }

  if (window.PointerEvent) {
    cv.addEventListener('pointerdown', function (e) {
      gesture();
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (!e.isPrimary && ptr.id !== null) return;          // ignore extra fingers
      if (aimStart(e.pointerId, e.clientX, e.clientY)) {
        e.preventDefault();
        try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      }
    });
    cv.addEventListener('pointermove', function (e) {
      if (e.pointerId !== ptr.id) return;
      e.preventDefault();
      aimMove(e.clientX, e.clientY);
    });
    cv.addEventListener('pointerup', function (e) {
      gesture();
      if (e.pointerId !== ptr.id) return;
      aimEnd(e.clientX, e.clientY, false);
    });
    cv.addEventListener('pointercancel', function (e) { if (e.pointerId === ptr.id) aimEnd(null, null, true); });
    cv.addEventListener('lostpointercapture', function (e) { if (e.pointerId === ptr.id && state.aim.active) aimEnd(null, null, true); });
  } else {
    // legacy touch fallback
    cv.addEventListener('touchstart', function (e) {
      gesture();
      var t = e.changedTouches[0];
      if (e.touches.length > 1) return;
      if (aimStart(t.identifier, t.clientX, t.clientY)) e.preventDefault();
    }, { passive: false });
    cv.addEventListener('touchmove', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier === ptr.id) { e.preventDefault(); aimMove(t.clientX, t.clientY); }
      }
    }, { passive: false });
    cv.addEventListener('touchend', function (e) {
      gesture();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier === ptr.id) aimEnd(t.clientX, t.clientY, false);
      }
    });
    cv.addEventListener('touchcancel', function () { aimEnd(null, null, true); });
    cv.addEventListener('mousedown', function (e) { gesture(); if (aimStart('m', e.clientX, e.clientY)) e.preventDefault(); });
    window.addEventListener('mousemove', function (e) { if (ptr.id === 'm') aimMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', function (e) { if (ptr.id === 'm') aimEnd(e.clientX, e.clientY, false); });
  }

  // audio unlock on any gesture (iOS: touchend/pointerup/click count as activation, pointerdown for mouse)
  function gesture() { if (!state.paused) Sound.resume(); Sound.unlock(); }
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(function (t) {
    window.addEventListener(t, gesture, { capture: true, passive: true });
  });

  // keyboard (desktop QA)
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'Escape' || k === 'p' || k === 'P') {
      if (state.screen === 'play') { if (state.paused) resume(); else pause(); e.preventDefault(); }
      else if (state.screen === 'select') setScreen('title');
    } else if ((k === 'r' || k === 'R') && state.screen === 'play' && !state.paused) {
      resetAttempt();
    } else if ((k === 'Enter' || k === ' ') && cardVisible() && doc.activeElement === doc.body) {
      var p = elCard.querySelector('.primary'); if (p) { e.preventDefault(); p.click(); }
    }
  });

  // ------------------------------------------------------------------ iOS hardening
  function pd(e) { if (e.cancelable) e.preventDefault(); }
  doc.addEventListener('touchmove', function (e) {
    var inScroll = e.target && e.target.closest && e.target.closest('.scroll');
    if (e.touches.length > 1 || !inScroll) pd(e);
  }, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu', 'selectstart'].forEach(function (t) {
    doc.addEventListener(t, pd, { passive: false });
  });
  var lastTouchEnd = 0;
  doc.addEventListener('touchend', function (e) {   // stop double-tap zoom outside controls
    var n = Date.now();
    var ctl = e.target && e.target.closest && e.target.closest('button, .scroll');
    if (!ctl && n - lastTouchEnd < 350) pd(e);
    lastTouchEnd = n;
  }, { passive: false });

  doc.addEventListener('visibilitychange', function () {
    if (doc.hidden) {
      if (state.screen === 'play') pause();
      Sound.suspend();
    } else {
      last = 0; acc = 0;
    }
  });
  window.addEventListener('pagehide', function () { if (state.screen === 'play') pause(); Sound.suspend(); });

  // ------------------------------------------------------------------ layout
  function readSafe() {
    var s = { top: 0, right: 0, bottom: 0, left: 0 };
    try {
      var cs = getComputedStyle(elProbe);
      s.top = parseFloat(cs.paddingTop) || 0; s.right = parseFloat(cs.paddingRight) || 0;
      s.bottom = parseFloat(cs.paddingBottom) || 0; s.left = parseFloat(cs.paddingLeft) || 0;
    } catch (e) {}
    return s;
  }
  var lastSize = '';
  function doResize(force) {
    var w = Math.round(window.innerWidth || doc.documentElement.clientWidth || 0);
    var h = Math.round(window.innerHeight || doc.documentElement.clientHeight || 0);
    if (w < 2 || h < 2) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    safe = readSafe();
    var key = w + 'x' + h + '@' + dpr + ':' + safe.top + ',' + safe.right + ',' + safe.bottom + ',' + safe.left;
    if (!force && key === lastSize) return;
    lastSize = key;
    Render.resize(w, h, dpr, safe);
    L = Render.layout;
    placeDom();
    if (state.screen === 'select') requestAnimationFrame(function () { drawThumbs(false); });
  }
  function px(v) { return Math.round(v) + 'px'; }
  function placeDom() {
    L = Render.layout;
    if (!L || !L.bottom || !L.plate) return;
    var b = L.bottom, p = L.plate, zw = b.w * 0.25;
    var zl = Math.max(b.x, safe.left), zr = Math.min(b.x + b.w, L.w - safe.right);
    elZoneL.style.left = px(zl); elZoneL.style.top = px(b.y); elZoneL.style.width = px(b.x + zw - zl); elZoneL.style.height = px(Math.max(44, b.h));
    elZoneR.style.left = px(b.x + b.w - zw); elZoneR.style.top = px(b.y); elZoneR.style.width = px(zr - (b.x + b.w - zw)); elZoneR.style.height = px(Math.max(44, b.h));
    // hint: marginal note on the wider side of the probe, anchored from the bottom so it grows upward
    var lv = state.level, sc = L.scale;
    if (lv) {
      var pr = Render.worldToScreen(lv.probe.x, lv.probe.y);
      var spaceR = p.x + p.w - 14 - (pr.x + 24), spaceL = pr.x - 24 - (p.x + 14);
      var onRight = spaceR >= spaceL, hw = Math.min(p.w - 28, Math.max(180, Math.min(260, onRight ? spaceR : spaceL)));
      elHint.classList.toggle('right', onRight); elHint.classList.toggle('left', !onRight);
      elHint.style.width = px(hw);
      if (onRight) { elHint.style.left = 'auto'; elHint.style.right = px(L.w - (p.x + p.w - 14)); }
      else { elHint.style.right = 'auto'; elHint.style.left = px(p.x + 14); }
      elHint.style.top = 'auto';
      elHint.style.bottom = px(Math.max(L.h - (pr.y - 18), L.h - b.y + 6));
      elNote.style.left = px(p.x + 16); elNote.style.width = px(p.w - 32);
      elNote.style.top = px(Math.min(pr.y + 30 * sc + 14, p.y + p.h - 34));
    }
    placeCard();
  }
  // result card: sized from the viewport & safe areas; beside the plate in landscape, otherwise in the lower
  // part of the plate (the target and seal sit near the top). Never extends past the viewport.
  function placeCard() {
    L = Render.layout;
    if (!L || !L.plate) return;
    var p = L.plate, W = L.w, H = L.h;
    var minTop = safe.top + 10, maxBottom = H - safe.bottom - 10, availH = Math.max(120, maxBottom - minTop);
    var spR = W - safe.right - (p.x + p.w) - 32, spL = p.x - safe.left - 32;
    var side = W > H && Math.max(spR, spL) >= 200;
    var cw = side ? Math.min(340, Math.max(spR, spL)) : Math.min(340, W - 24 - safe.left - safe.right);
    elCard.style.width = px(cw);
    elCard.classList.toggle('narrow', cw < 320);
    elCard.style.maxHeight = px(availH);
    elCard.style.bottom = 'auto';
    var ch = elCard.offsetHeight || 230, top, left;
    if (side) {
      left = spR >= spL ? p.x + p.w + 16 : p.x - 16 - cw;
      top = (H - ch) / 2;
    } else {
      left = safe.left + (W - safe.left - safe.right - cw) / 2;
      top = Math.min(p.y + p.h - 10, maxBottom) - ch;
    }
    top = Math.max(minTop, Math.min(top, maxBottom - ch));
    elCard.style.left = px(left);
    elCard.style.top = px(top);
  }
  window.addEventListener('resize', function () { doResize(false); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { doResize(true); }, 250); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { doResize(false); });

  // ------------------------------------------------------------------ main loop
  var last = 0, acc = 0;
  var ft = new Float32Array(60), ftI = 0, ftN = 0, renderErr = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    var dt = last ? (t - last) / 1000 : 0;
    last = t;
    if (dt > 0 && dt < 1) { ft[ftI] = dt; ftI = (ftI + 1) % 60; if (ftN < 60) ftN++; }
    if (dt > 0.25 || dt < 0) dt = K.DT;                        // tab switch / clock jump: don't catch up
    if (state.screen === 'play' && !state.paused) {
      acc += dt;
      var n = 0;
      while (acc >= K.DT && n < K.MAX_STEPS_PER_FRAME) { physStep(); acc -= K.DT; n++; }
      if (n >= K.MAX_STEPS_PER_FRAME && acc > K.DT) acc = 0;    // drop the backlog rather than spiral
      if (state.phase === 'aim') updatePrediction();
      else if (state.phase === 'flight' && state.sim && state.sim.status === 'flying') Sound.droneSpeed(Physics.speed(state.sim) / K.VMAX / 1.4);
    } else acc = 0;
    try { Render.frame(state, t); }
    catch (e) { if (renderErr++ < 3) console.error('Render.frame', e); }
  }

  // ------------------------------------------------------------------ QA hooks (§10)
  function findSolution(lv, step) {
    function hits(v) { return v && Physics.simulate(lv, v.vx, v.vy, step, K.MAX_STEPS).status === 'hit'; }
    var s = null;
    try { s = Levels.solve(lv, { t0Step: step }); } catch (e) { s = null; }
    if (hits(s)) return { vx: s.vx, vy: s.vy, t0Step: step };
    // coarse → fine brute force (QA only; never used in normal play)
    var powers = [1, 0.85, 0.7, 0.92, 0.78, 0.62, 0.55, 0.48, 0.4, 0.34, 0.97, 0.66, 0.74, 0.82, 0.58, 0.88, 0.52, 0.44];
    for (var pi = 0; pi < powers.length; pi++) {
      for (var a = 0; a < 720; a++) {
        var ang = a * Math.PI / 360, v = K.VMAX * powers[pi];
        var c = { vx: Math.cos(ang) * v, vy: Math.sin(ang) * v };
        if (hits(c)) return { vx: c.vx, vy: c.vy, t0Step: step };
      }
    }
    return null;
  }
  function hookPrepare() {
    if (state.screen !== 'play') return false;
    if (state.paused) resume();
    if (state.phase === 'result') resetAttempt();
    else if (state.phase === 'flight') { timers.length = 0; state.sim = null; state.phase = 'aim'; }
    hideCard();
    return true;
  }
  function fastForward(n) {
    n = Math.max(0, n | 0);
    for (var i = 0; i < n; i++) {
      if (state.screen !== 'play') break;
      physStep();
    }
    if (state.phase === 'aim') updatePrediction();
    return state.step;
  }
  function fps() {
    if (!ftN) return 0;
    var s = 0; for (var i = 0; i < ftN; i++) s += ft[i];
    return s > 0 ? ftN / s : 0;
  }
  window.__peri = {
    state: state, Physics: Physics, Levels: Levels, Render: Render, Sound: Sound, Save: Save,
    loadLevel: function (i) { return loadCampaign(i); },
    loadEndless: function (seed) { return startEndless(seed); },
    launch: function (vx, vy) {
      if (!hookPrepare()) return false;
      if (state.launches >= K.MAX_LAUNCHES) resetAttempt();
      return doLaunch(+vx, +vy);
    },
    fastForward: fastForward,
    solveCurrent: function () {
      if (!hookPrepare()) return null;
      if (state.launches >= K.MAX_LAUNCHES) resetAttempt();
      var lv = state.level, sol = lv.solution;
      if (sol) {
        var t0 = sol.t0Step | 0;
        if (hasMoving(lv) && t0 !== state.step) { timers.length = 0; state.step = t0; }
      } else {
        sol = findSolution(lv, state.step);
      }
      if (!sol) return null;
      doLaunch(sol.vx, sol.vy);
      return { vx: sol.vx, vy: sol.vy, t0Step: state.step };
    },
    fps: fps,
    screen: function (name) {
      if (name == null) return state.screen;
      if (name === 'play' && state.screen !== 'play') { if (state.mode === 'endless' && state.endless.round > 0) setScreen('play'); else loadCampaign(state.levelIndex); }
      else setScreen(name);
      return state.screen;
    },
    pause: pause, resume: resume
  };

  function snapshot() {
    try {
      var hot = window.claude && window.claude.hot;
      if (hot && typeof hot.snapshot === 'function' && !snapshot.done) {
        snapshot.done = true;
        hot.snapshot(function () { return { screen: state.screen, levelIndex: state.levelIndex, mode: state.mode }; });
      }
    } catch (e) {}
  }

  // ------------------------------------------------------------------ boot
  Render.init(cv);
  doResize(true);
  if (state.level) { try { Render.setLevel(state.level); } catch (e) { console.error('Render.setLevel', e); } }
  buildGrid();
  refreshTitle();
  setScreen('title');
  try {
    if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function () {
      if (thumbsDrawn) drawThumbs(true);
      placeDom();
    });
  } catch (e) {}
  requestAnimationFrame(loop);
})();

</script>
<script>
/* Offline support: only on http(s), never inside a host iframe. All URLs are relative so a project site under
   /<repo>/ works. */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.top === window.self) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
